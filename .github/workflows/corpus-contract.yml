name: corpus-contract

# Remote enforcement for the idea corpus. The local pre-commit hook is per-clone and
# overridable with --no-verify; this runs on the server for every push and pull request.
#
# The validators live in the skill repo (Nortropic/nortropic-intake), so this workflow
# checks it out alongside the corpus. Both repos are public, so the default GITHUB_TOKEN
# suffices and NO credential is stored anywhere — the optional INTAKE_SKILL_TOKEN below
# is only a fallback should the skill repo ever go private again.
#
# NOTE: present is not the same as REQUIRED. This is a required status check on
# main — see the repository's branch protection — so a red run blocks the merge.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the corpus
        uses: actions/checkout@v4
        with:
          path: corpus
          fetch-depth: 0        # the append-only clarification check reads HEAD

      - name: Check out the intake skill (validators)
        uses: actions/checkout@v4
        with:
          repository: Nortropic/nortropic-intake
          path: skill
          token: ${{ secrets.INTAKE_SKILL_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Approved-plan contract over every idea package
        run: python3 skill/scripts/plan_contract.py --corpus corpus validate

      - name: Context contract — manifests, clarifications, provenance integrity
        run: python3 skill/scripts/context_contract.py --corpus corpus validate

      - name: RND contract — every committed compile under _rnd/
        run: |
          set -e
          # _rnd/ is a durable corpus artifact, so a committed compile must hold its
          # contract here too. Note the v4.0 CLI takes --corpus on the SUBCOMMAND, not
          # globally like plan/context above, and exits 1 when the corpus carries no
          # compile at all — so only invoke it once there is something to falsify.
          if ls -d corpus/_rnd/*/ >/dev/null 2>&1; then
            echo "committed RND compiles:"
            ls -1 corpus/_rnd
            python3 skill/scripts/rnd_contract.py validate --corpus corpus
          else
            echo "no committed RND compiles under corpus/_rnd — nothing to validate"
          fi

      - name: Project contract — sweep coverage and the attachment source surface
        run: |
          set -e
          # THIS STEP DID NOT EXIST until the r38 attachment source-surface
          # remediation went looking for where its new gate would actually run, and
          # found the answer was nowhere. `project_contract.py validate` — the whole
          # PROJECT_SWEEP contract: manifest-vs-tree, revision hashes, source
          # immutability, idea provenance, review queue, sweep audit, false
          # completeness — was referenced by neither this workflow nor the local
          # pre-commit hook. The sweep was the one layer of the corpus nothing
          # checked on the server, which is the same class of hole as a body digest
          # standing in for a source: something looked verified because something
          # ELSE was.
          #
          # It also means the attachment gate would have been decorative. A check
          # that never runs is not a check, whatever its test suite says.
          if ls -d corpus/_projects/*/ >/dev/null 2>&1; then
            python3 skill/scripts/project_contract.py --corpus corpus validate
          else
            echo "no swept projects under corpus/_projects — nothing to validate"
          fi

      - name: Attachment source surface — declared vs observed, per bound revision
        run: |
          set -e
          # Reported even when green, because the interesting number is not "0
          # findings" but MATERIAL_WITHOUT_BYTES and the reconciliation split. A
          # corpus whose material attachments are all unavailable is not a corpus in
          # trouble — it is a corpus being honest — and that has to be legible
          # without reading a failure.
          for d in corpus/_projects/*/; do
            [ -f "$d/project-manifest.json" ] || continue
            python3 skill/scripts/project_contract.py --corpus corpus \
              attachments --project "$(basename "$d")" || true
          done

      - name: Capture-signature goldens (the corpus holds the sources)
        run: |
          set -e
          for slug in gauntlet-wayfinder nortropic-organization-os; do
            sig="skill/evals/golden/$slug.signature.json"
            src="corpus/$slug/$slug-full-chat.md"
            if [ -f "$sig" ] && [ -f "$src" ]; then
              python3 skill/evals/capture_signature.py "$src" --check "$sig"
            else
              echo "MISSING golden or source for $slug"; exit 1
            fi
          done

      - name: One row per idea in INDEX.md
        run: |
          set -e
          missing=0
          for dir in corpus/*/; do
            slug=$(basename "$dir")
            [ -f "$dir/idea-$slug.md" ] || continue
            if ! grep -q "^| $slug |" corpus/INDEX.md; then
              echo "INDEX.md has no row for $slug"
              missing=1
            fi
          done
          # the index is an idea catalogue, not a file inventory
          if grep -qE '^\| .*(-approved-plan|-plan-candidate|-context-manifest|-owner-clarifications)' corpus/INDEX.md; then
            echo "INDEX.md contains an artifact row; it must carry one row per IDEA only"
            missing=1
          fi
          exit $missing
